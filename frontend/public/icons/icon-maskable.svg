<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background for maskable (OS clips to shape) -->
  <rect width="512" height="512" fill="#1D4731"/>
  <!-- Ring accents — scaled to safe zone (80% diameter = r≤204) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#D4911E" stroke-width="7" opacity="0.35"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#D4911E" stroke-width="3" opacity="0.2"/>
  <!-- UJ wordmark — smaller to stay within safe zone -->
  <text x="256" y="302" font-family="Georgia, serif" font-size="160" font-weight="700" fill="#F7F2E8" text-anchor="middle" letter-spacing="-5">UJ</text>
</svg>
