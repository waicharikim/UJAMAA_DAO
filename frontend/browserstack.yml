userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: playwright

browsers:
  - browser: chrome
    browser_version: latest
    os: OS X
    os_version: Sonoma
  - browser: safari
    browser_version: latest
    os: OS X
    os_version: Sonoma
  - browser: firefox
    browser_version: latest
    os: Windows
    os_version: 11
  - browser: edge
    browser_version: latest
    os: Windows
    os_version: 11

# Mobile browsers
  - browser: chrome
    browser_version: latest
    os: android
    os_version: 14
    device: Samsung Galaxy S24
  - browser: safari
    browser_version: latest
    os: ios
    os_version: 17
    device: iPhone 15

testSuite: tests/browserstack

projectName: UjamaaDAO
buildName: ujamaa-dev
buildIdentifier: "#{BUILD_NUMBER}"

parallelsPerPlatform: 1
browserstackLocal: true

debug: false
networkLogs: false
consoleLogs: errors
