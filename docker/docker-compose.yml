  # ═════════════════════════════════════════════════════════════════════════
  # DATABASE & CACHE (SAME FOR BOTH VERSIONS)
  # ═════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: ujamaa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ujamaa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ujamaa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ujamaa_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed for direct DB access during dev
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ujamaa_user} -d ${POSTGRES_DB:-ujamaa_db}"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  postgres_test:
    image: postgres:15-alpine
    container_name: ujamaa_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ujamaa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ujamaa_pass}
      POSTGRES_DB: ujamaa_test_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different host port for test DB
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ujamaa_user} -d ujamaa_test_db"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ujamaa_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"  # Exposed for direct Redis access during dev (6379 reserved for host Redis)
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ─────────────────────────────────────────────
  # DATADOG AGENT
  # ─────────────────────────────────────────────
  datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: ujamaa_datadog
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=us5.datadoghq.com
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=name:ujamaa_datadog
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_HOSTNAME=ujamaa-dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - ./datadog/conf.d:/etc/datadog-agent/conf.d:ro
    networks:
      - backend

