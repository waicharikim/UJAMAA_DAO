
services:
  postgres:
    image: postgres:15-alpine
    container_name: ujamaa_postgres
    restart: always
    environment:
      POSTGRES_USER: ujamaa_user
      POSTGRES_PASSWORD: ujamaa_pass
      POSTGRES_DB: ujamaa_db
    volumes:
      - ujamaa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ujamaa_user -d ujamaa_db"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s  

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ujamaa_backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://ujamaa_user:ujamaa_pass@postgres:5432/ujamaa_db
      NODE_ENV: development
      JWT_SECRET_KEY: 6e603cfa9affb7677020ad6a930bd3f076867ff38d100586dc5d985bed845ad0
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/usr/src/app  # Mount backend code for live updates
      - /usr/src/app/node_modules # Preserve node_modules inside container
    command: sh -c "./docker/start.sh" # Runs nodemon + ts-node
    restart: on-failure

  # Add frontend & blockchain-node services here as needed e.g.
  # frontend:
  #   ...

volumes:
  ujamaa_pgdata: