name: Build & Push Frontend Image

# Builds the production frontend Docker image on GitHub's runners (7–16 GB RAM)
# and pushes it to GitHub Container Registry (ghcr.io). The 2 GB prod droplet
# then just `docker compose pull`s the finished image instead of compiling Next
# itself — turning a multi-minute, swap-thrashing on-box build into a fast pull.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch: {}

# One build per branch; newer pushes cancel older in-flight builds.
concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces tags: `latest` + a short-SHA tag (e.g. sha-1a2b3c4) so each
      # deploy is pinnable/rollback-able.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ujamaa-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persist BuildKit layer cache between runs (incl. the npm cache mount).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
          # must be present here. Non-secret config → repo Variables; the Sentry
          # values → repo Secrets. See the workflow README note below for setup.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
