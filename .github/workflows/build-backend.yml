name: Build & Push Backend Images

# Builds the production backend images (web + worker) on GitHub's runners and
# pushes them to GHCR, so the 2 GB droplet never runs the backend compile —
# which asks for 3 GB of heap (see backend/Dockerfile builder stage) and OOMs /
# swap-thrashes on the droplet. web and worker share the one `builder` stage, so
# the expensive `tsc` build runs once and both images reuse it.

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push web + worker to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── WEB ──────────────────────────────────────────────────────────────
      - name: Tags · web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ujamaa-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push · web
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod-web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── WORKER ───────────────────────────────────────────────────────────
      # Reuses the `builder` stage cached by the web step above (same scope), so
      # the tsc compile is not repeated.
      - name: Tags · worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ujamaa-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push · worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod-worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
